[package]
name = "r2r-jev"
version = "0.1.0"
edition = "2021"
description = "Jev judgments as evidence for persistent R2R governance state"
repository = "https://github.com/Thneoly/r2r-jev"
default-run = "r2r-jev"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
