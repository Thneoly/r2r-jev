[package]
name = "r2r-jev"
version = "0.1.0"
edition = "2021"
description = "Jev judgments as evidence for persistent R2R governance state"
homepage = "https://github.com/Thneoly/r2r-jev"
repository = "https://github.com/Thneoly/r2r-jev"
license = "Apache-2.0"
default-run = "r2r-jev"

[dependencies]
anyhow = "1"
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process"] }
